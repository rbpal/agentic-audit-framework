# ============================================================================
# Shared observability kit: ai_ops_kit (library, distributable separately)
# ----------------------------------------------------------------------------
# Standalone Python package declaring ONLY this kit's own dependencies
# (OpenTelemetry stack + structlog) so it can install in any consumer venv
# without dragging the main project's dependency closure along.
#
# Consumed by:
#   - Project 1 (agentic-audit-framework, this repo): natively from
#     `ai_ops_kit/` at repo root. The main pyproject's pytest config sets
#     `pythonpath = ["."]` so tests can `from ai_ops_kit import ...`.
#   - Projects 2 & 3: as a git submodule at `./ai_ops_kit/`, pinned to a
#     specific commit SHA. Consumers update pins explicitly — no
#     auto-upgrade across breaking changes.
#
# This is one of TWO pyproject.toml files in this repo — don't confuse them:
#
#   ../pyproject.toml  ← the main application (agentic-audit-framework)
#   ./pyproject.toml   ← THIS FILE — the shared observability kit (library)
#
# See `ai_ops_kit/README.md` for the full consumption model, versioning
# policy, and the self-containment guarantee (the kit must NEVER import
# from project-specific code; the CI check enforcing this lands in
# step_09_task_05).
# ============================================================================

[project]
name = "ai_ops_kit"
version = "0.1.0"
description = "Shared OpenTelemetry tracer, structured JSON logging, and agent-call decorators for AI workloads"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
authors = [
    { name = "Rajendra B Pal" }
]
dependencies = [
    "opentelemetry-api (>=1.41.0,<2.0.0)",
    "opentelemetry-sdk (>=1.41.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.41.0,<2.0.0)",
    "opentelemetry-instrumentation (>=0.62b0,<0.63)",
    "structlog (>=24.1.0,<26.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit packages + package-dir mapping because this is a "flat" layout
# where the project root IS the package (the kit's __init__.py sits next to
# this pyproject.toml). setuptools' default `find` config would look for an
# `ai_ops_kit/` subdirectory inside the project root — which doesn't exist —
# and produce an empty install. The explicit mapping says "package `ai_ops_kit`
# lives at `.`", so `pip install -e .` works inside the kit dir and the kit
# is consumable as a pip package by Projects 2 and 3.
[tool.setuptools]
packages = ["ai_ops_kit"]
package-dir = {"ai_ops_kit" = "."}

# Pytest config so `pytest` from inside the kit dir discovers the standalone
# tests at `./tests/`. (Project 1's main pytest finds the SAME tests too via
# its own `pythonpath=["."]`, but the kit's standalone suite must work in
# isolation when consumers run it via verify_kit_reusable.py or directly.)
[tool.pytest.ini_options]
testpaths = ["tests"]
