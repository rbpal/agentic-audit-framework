# ============================================================================
# Main project: agentic-audit-framework (Project 1, the application)
# ----------------------------------------------------------------------------
# This pyproject declares the application's dependencies (LangGraph, Azure
# OpenAI, Databricks, OpenTelemetry, MLflow, etc.) and owns the source code
# at `src/agentic_audit/`. It's what `poetry install` resolves at the repo
# root and what CI installs to run the test suite.
#
# This repo has TWO pyproject.toml files — don't confuse them:
#
#   ./pyproject.toml            ← THIS FILE — the main application
#   ./ai_ops_kit/pyproject.toml ← the standalone shared observability kit
#
# Why two? `ai_ops_kit/` is a co-package at the repo root (see
# `ai_ops_kit/README.md`) that lives here natively for Project 1 and is
# consumed via git submodule by Projects 2 and 3. Its own pyproject lets
# it install standalone in any consumer venv WITHOUT dragging this main
# project's dependency closure (LangGraph, Databricks, MLflow, …) along.
#
# The two are independent units of distribution: this one is an application
# you run; the kit is a library you import. They share a repo for
# development convenience; they don't share a dependency graph.
# ============================================================================

[project]
name = "agentic-audit-framework"
version = "0.1.0"
description = ""
authors = [
    {name = "Rajendra B Pal",email = "rajendra1b1pal@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph (>=1.1.8,<2.0.0)",
    "langchain-openai (>=1.1.15,<2.0.0)",
    "openai (>=2.32.0,<3.0.0)",
    "azure-identity (>=1.18.0,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pandas (>=2.2,<3.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "opentelemetry-api (>=1.40,<1.41)",
    "opentelemetry-sdk (>=1.40,<1.41)",
    "opentelemetry-instrumentation (>=0.61b0,<0.62b0)",
    "mlflow (>=3.11.1,<4.0.0)",
    "streamlit (>=1.56.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "rapidfuzz (>=3.10,<4.0.0)",
    "opentelemetry-exporter-otlp (>=1.40,<1.41)",
    "structlog (>=24.1.0,<26.0.0)",
    "azure-monitor-opentelemetry (>=1.6.0,<2.0.0)",
    "azure-monitor-opentelemetry-exporter (>=1.0.0b52,<2.0.0)"
]


[project.scripts]
generate-gold = "agentic_audit.cli.generate_gold:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agentic_audit", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "ruff (>=0.15.11,<0.16.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "types-pyyaml (>=6.0.12.20260408,<7.0.0.0)"
]

# ============================================================================
# Quality tool configuration (Task 2)
# ============================================================================

# ----- Ruff: lint + format -------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E,W pycodestyle | F pyflakes | I isort | UP pyupgrade | B bugbear
# SIM simplify | N pep8-naming
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = [
    "E501",  # line-too-long: formatter handles it
    "B008",  # function-call-in-default-argument: false-positive on FastAPI/typer
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow `assert` in tests
# Databricks notebooks:
#   F821  — `spark`, `display`, `dbutils` are runtime-injected globals.
#   UP017 — Serverless Starter Warehouse runs Python 3.10; `datetime.UTC`
#           (added in 3.11) breaks at import. Keep `timezone.utc`.
#   E402  — Notebooks legitimately interleave %pip install → restartPython()
#           → imports across cells; ruff sees code-before-import.
"infra/databricks/notebooks/*.py" = ["F821", "UP017", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_audit"]

# ----- Mypy: strict typing on src/ ----------------------------------------
[tool.mypy]
python_version = "3.11"
strict_optional = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "azure.identity.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langgraph.*",
    "mlflow.*",
    "openai.*",
    "openpyxl.*",
    "rapidfuzz.*",
    "streamlit.*",
    "tenacity.*",
]
ignore_missing_imports = true

# ai_ops_kit is a standalone co-package with its OWN mypy gate (the
# "Kit reusable" CI job + ai_ops_kit/pyproject.toml). From src/'s
# perspective it is an external dependency: trust its published API,
# don't re-type-check its internals. Without follow_imports=skip, mypy
# walks into the kit's modules and reports errors that belong to the
# kit's gate, not this repo's — and the two configs resolve structlog /
# opentelemetry differently, so they diverge.
[[tool.mypy.overrides]]
module = "ai_ops_kit.*"
follow_imports = "skip"
ignore_missing_imports = true

# ----- Pytest: async auto, coverage floor ---------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so co-located packages outside `src/` (e.g. ai_ops_kit/)
# are importable in tests. Without this, `from ai_ops_kit import ...` raises
# ModuleNotFoundError because the kit isn't part of [tool.poetry] packages.
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: fast isolated tests",
    "integration: hits real services (Azure, Databricks)",
    "slow: excluded from default pre-commit run",
]

# ----- Coverage: branch coverage, 70% global floor ------------------------
[tool.coverage.run]
branch = true
source = ["src/agentic_audit"]
omit = [
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2
fail_under = 90
