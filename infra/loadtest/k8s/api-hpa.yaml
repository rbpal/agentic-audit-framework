# API horizontal autoscaler — scales the ingress on CPU. The API is light
# (it just enqueues), so this mostly demonstrates the pod-tier scale; the
# heavy/interesting scaling is the KEDA worker (worker-scaledobject.yaml).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
