# Public entry into the cluster. type: LoadBalancer → AKS provisions the
# Standard LB and attaches the Terraform-created static IP (named in the node
# RG) via the azure-pip-name annotation. That same IP is Front Door's origin,
# so the origin is known at terraform-apply time (no kubectl-LB chicken-and-egg).
apiVersion: v1
kind: Service
metadata:
  name: audit-api
  annotations:
    # References the static IP by name in the AKS node RG (pip-<name_prefix>-lb).
    service.beta.kubernetes.io/azure-pip-name: "${LB_PIP_NAME}"
spec:
  type: LoadBalancer
  selector: { app: audit-api }
  ports:
    - name: http
      port: 80
      targetPort: 8000
