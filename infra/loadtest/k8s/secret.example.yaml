# Documents the keys the API + worker read. DO NOT commit real values.
# Create the real secret at apply time (values from `terraform output` + the
# durable stack's env) — see k8s/README.md:
#
#   kubectl create secret generic aaf-loadtest-secrets \
#     --from-literal=SERVICEBUS_CONNECTION_STRING="$(terraform -chdir=infra/loadtest output -raw servicebus_connection_string)" \
#     --from-literal=AZURE_OPENAI_ENDPOINT="https://aoai-aaf-rbpal-dev.openai.azure.com/" \
#     --from-literal=DATABRICKS_HOST="$DATABRICKS_HOST" \
#     --from-literal=DATABRICKS_TOKEN="$DATABRICKS_TOKEN" \
#     --from-literal=DATABRICKS_SQL_WAREHOUSE_ID="$DATABRICKS_SQL_WAREHOUSE_ID" \
#     --from-literal=APPLICATIONINSIGHTS_CONNECTION_STRING="$APPLICATIONINSIGHTS_CONNECTION_STRING"
#
# The mock scaling run needs only SERVICEBUS_CONNECTION_STRING; the rest are
# consumed only when the worker runs in REAL mode (AAF_MOCK_BACKENDS=0).
apiVersion: v1
kind: Secret
metadata:
  name: aaf-loadtest-secrets
type: Opaque
stringData:
  SERVICEBUS_CONNECTION_STRING: "<from: terraform output -raw servicebus_connection_string>"
  AZURE_OPENAI_ENDPOINT: "https://aoai-aaf-rbpal-dev.openai.azure.com/"
  DATABRICKS_HOST: "<from durable-stack env>"
  DATABRICKS_TOKEN: "<from durable-stack env>"
  DATABRICKS_SQL_WAREHOUSE_ID: "<from durable-stack env>"
  APPLICATIONINSIGHTS_CONNECTION_STRING: "<appi-aaf-dev connection string>"
