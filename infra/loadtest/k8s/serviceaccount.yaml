# ServiceAccount the worker pods run under for keyless Azure OpenAI access.
#
# The azure.workload.identity/client-id annotation binds this SA to the UAMI
# created in Terraform (module.workload_identity). Together with the pod label
# azure.workload.identity/use="true" (set on the worker Deployment), the
# Workload Identity mutating webhook injects a projected token + the
# AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE env vars that
# DefaultAzureCredential consumes — so the worker gets an AAD token for Azure
# OpenAI with no API key and no secret.
#
# Apply (envsubst fills the client ID from the Terraform output):
#   export WORKLOAD_IDENTITY_CLIENT_ID=$(terraform -chdir=infra/loadtest output -raw workload_identity_client_id)
#   envsubst < infra/loadtest/k8s/serviceaccount.yaml | kubectl apply -f -
#
# Needed only for the REAL burst (AAF_MOCK_BACKENDS=0). Mock pods ignore it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-worker-sa
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_IDENTITY_CLIENT_ID}"
